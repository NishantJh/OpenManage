name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openmanage-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Never run untrusted pull-request code on the self-hosted WSL2 runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openmanage
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: openmanage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openmanage -d openmanage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check Go formatting
        shell: bash
        run: |
          mapfile -t files < <(find cmd -name '*.go' -type f)
          test "${#files[@]}" -gt 0
          unformatted="$(gofmt -l "${files[@]}")"
          if [ -n "$unformatted" ]; then
            printf 'Go files need gofmt:\n%s\n' "$unformatted"
            gofmt -d "${files[@]}"
            exit 1
          fi
      - name: Build frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Prepare embedded assets
        run: mkdir -p cmd/openmanage/web/dist && cp -a web/dist/. cmd/openmanage/web/dist/
      - name: Vet Go package
        run: go vet ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: Verify dependency metadata
        run: |
          go mod tidy -diff
          git diff --exit-code -- go.mod go.sum web/package.json web/package-lock.json
      - name: Test Go package
        env:
          OPENMANAGE_TEST_DATABASE_URL: postgres://openmanage:ci-only-not-a-secret@localhost:5432/openmanage_test?sslmode=disable
        run: go test -race ./...
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          OPENMANAGE_ADMIN_PASSWORD: ci-only-not-a-secret-password
        run: docker compose config --quiet
      - name: Build Docker image
        run: docker build -t openmanage:pr .

      - name: Run disposable end-to-end smoke test
        run: bash scripts/smoke-test.sh
