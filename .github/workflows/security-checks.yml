name: Security Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openmanage-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-vulnerability-scan:
    # PRs stay on GitHub-hosted runners; trusted main/scheduled scans use Ubuntu self-hosted.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "openmanage-ci"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - name: Resolve Go dependencies
        run: go mod tidy
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan Go dependencies and reachable code
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

  frontend-dependency-audit:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "openmanage-ci"]') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Resolve frontend dependencies
        run: npm install --no-fund
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
