name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openmanage-main-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # workflow_dispatch can target arbitrary refs; never execute a non-main ref here.
    # Only trusted main-branch code runs on the persistent self-hosted runner.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, openmanage-ci]
    steps:
      - uses: actions/checkout@v7
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd/openmanage/*.go)"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Prepare embedded assets
        run: mkdir -p cmd/openmanage/web/dist && cp -a web/dist/. cmd/openmanage/web/dist/
      - name: Verify dependency metadata
        run: |
          go mod tidy -diff
          git diff --exit-code -- go.mod go.sum web/package.json web/package-lock.json
      - name: Test Go package
        run: go test ./...
      - name: Build Docker image
        run: docker build -t openmanage:ci .

      - name: Run disposable end-to-end smoke test
        run: bash scripts/smoke-test.sh
