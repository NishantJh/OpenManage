name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Prepare embedded assets
        run: mkdir -p cmd/openmanage/web/dist && cp -a web/dist/. cmd/openmanage/web/dist/
      - name: Resolve Go dependencies
        run: go mod tidy
      - name: Test Go package
        run: go test ./...
      - name: Build Docker image
        run: docker build -t openmanage:ci .
