name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # Register your WSL2 runner with the custom label "WSL2".
    # Deliberately no pull_request trigger: this repository is public and
    # self-hosted runners must not execute untrusted fork code.
    runs-on: [self-hosted, Linux, X64, WSL2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Prepare embedded assets
        run: mkdir -p cmd/openmanage/web/dist && cp -a web/dist/. cmd/openmanage/web/dist/
      - name: Resolve Go dependencies
        run: go mod tidy
      - name: Test Go package
        run: go test ./...
      - name: Build Docker image
        run: docker build -t openmanage:ci .
