name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openmanage-main-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # workflow_dispatch can target arbitrary refs; never execute a non-main ref here.
    # Pull-request code is validated on GitHub-hosted runners in pr-validation.yml.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, WSL2]
    steps:
      - uses: actions/checkout@v4
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd/openmanage/*.go)"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Prepare embedded assets
        run: mkdir -p cmd/openmanage/web/dist && cp -a web/dist/. cmd/openmanage/web/dist/
      - name: Resolve Go dependencies
        run: go mod tidy
      - name: Test Go package
        run: go test ./...
      - name: Build Docker image
        run: docker build -t openmanage:ci .

      - name: Run disposable end-to-end smoke test
        run: bash scripts/smoke-test.sh
