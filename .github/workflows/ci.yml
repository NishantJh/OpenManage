name: CI
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openmanage-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Branch pushes originate from repository writers. No pull_request trigger is used
    # because this is a public repository and the runner is self-hosted.
    runs-on: [self-hosted, Linux, X64, WSL2]
    steps:
      - uses: actions/checkout@v4
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd/openmanage/*.go)"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Prepare embedded assets
        run: mkdir -p cmd/openmanage/web/dist && cp -a web/dist/. cmd/openmanage/web/dist/
      - name: Resolve Go dependencies
        run: go mod tidy
      - name: Test Go package
        run: go test ./...
      - name: Build Docker image
        run: docker build -t openmanage:ci .
