name: Prepare dependency lockfile branch

on:
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/dependency-lockfiles.yml"

concurrency:
  group: openmanage-dependency-lockfiles
  cancel-in-progress: false

jobs:
  generate:
    # Generate only from trusted main commits, on a GitHub-hosted runner.
    # This job has read-only repository permissions and never receives a write token.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate Go dependency metadata
        run: go mod tidy

      - name: Generate and verify frontend lockfile
        working-directory: web
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Verify generated metadata and run Go tests
        run: |
          git diff --exit-code -- web/package.json
          test -s go.sum
          test -s web/package-lock.json
          mkdir -p cmd/openmanage/web/dist
          cp -a web/dist/. cmd/openmanage/web/dist/
          go test ./...

      - name: Upload generated dependency metadata
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfiles
          path: |
            go.mod
            go.sum
            web/package-lock.json
          if-no-files-found: error
          retention-days: 1

  publish:
    # The only job with repository write permission. It does not install
    # dependencies or execute project build/test scripts.
    needs: generate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Download generated dependency metadata
        uses: actions/download-artifact@v4
        with:
          name: dependency-lockfiles
          path: generated

      - name: Prepare isolated branch and verify artifact paths
        run: |
          test -s generated/go.mod
          test -s generated/go.sum
          test -s generated/web/package-lock.json
          git checkout -b "chore/dependency-lockfiles-${GITHUB_RUN_ID}"
          cp generated/go.mod go.mod
          cp generated/go.sum go.sum
          mkdir -p web
          cp generated/web/package-lock.json web/package-lock.json
          git diff --exit-code -- web/package.json

      - name: Commit and publish generated metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum web/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency metadata is already current; no branch was pushed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "chore: add reproducible dependency lockfiles"
          branch="$(git branch --show-current)"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin "$branch"
          {
            echo "Generated dependency metadata and pushed `$branch`."
            echo "Review the branch and open a PR against `main`; CI should then switch to lockfile verification."
          } >> "$GITHUB_STEP_SUMMARY"
