name: OpenWrt VM flash
# Opt-in: boots an official OpenWrt x86-64 image in QEMU, flashes the next release through
# OpenManage's firmware upgrade and checks the device after it restarts. GitHub-hosted
# only; it never runs on the self-hosted runner and never touches real devices.
on:
  workflow_dispatch:
    inputs:
      old_version:
        description: OpenWrt release the VM starts on
        default: "24.10.3"
      new_version:
        description: OpenWrt release to flash
        default: "24.10.4"
permissions:
  contents: read
concurrency:
  # Share one lock with the OpenWrt lab workflow; both use host networking resources.
  group: openmanage-self-hosted-lab
  cancel-in-progress: false
jobs:
  flash:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, openmanage-ci]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Run the VM flash test
        env:
          OPENWRT_OLD_VERSION: ${{ inputs.old_version }}
          OPENWRT_NEW_VERSION: ${{ inputs.new_version }}
        run: bash scripts/openwrt-vm-flash-test.sh
