name: OpenWrt lab
# Opt-in: runs enrollment, health checks and monitoring against a disposable OpenWrt
# rootfs container. Runs only from main on the dedicated Ubuntu self-hosted runner.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
concurrency:
  # Share one lock with the QEMU flash workflow; both use host networking resources.
  group: openmanage-self-hosted-lab
  cancel-in-progress: false
jobs:
  lab:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, openmanage-ci]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - name: Run OpenWrt lab test
        env:
          OPENMANAGE_LAB_BROWSER: "1"
        run: bash scripts/openwrt-lab-test.sh
