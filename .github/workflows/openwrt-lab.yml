name: OpenWrt lab
# Opt-in: runs enrollment, health checks and monitoring against a disposable OpenWrt
# rootfs container. Runs on the self-hosted runner, so it is dispatch/schedule only:
# never add a pull_request trigger (the repository is public).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
concurrency:
  group: openwrt-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lab:
    runs-on: [self-hosted, Linux, X64, WSL2]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - name: Install eapol_test
        run: command -v eapol_test >/dev/null || (sudo apt-get update && sudo apt-get install -y eapoltest)
      - name: Run OpenWrt lab test
        env:
          OPENMANAGE_LAB_BROWSER: "1"
          # Needs sudo, which the self-hosted runner lacks; its browser libraries are installed once by hand.
          OPENMANAGE_LAB_SKIP_PLAYWRIGHT_DEPS: "1"
        run: bash scripts/openwrt-lab-test.sh
