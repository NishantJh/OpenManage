name: Publish image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# One group per commit: a newer merge never replaces a queued run, so every commit that
# reaches main gets its sha tag for rollback. Runs are independent; see the latest check below.
concurrency:
  group: openmanage-publish-image-${{ github.sha }}
  cancel-in-progress: false
jobs:
  publish:
    # workflow_dispatch can target arbitrary refs; only main is ever published.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Choose tags
        id: tags
        run: |
          image=ghcr.io/nishantjh/openmanage
          {
            echo 'list<<EOF'
            echo "$image:sha-$GITHUB_SHA"
            # Only the newest main commit moves latest, so a slow older run cannot overwrite it.
            if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ]; then echo "$image:latest"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      # Third-party actions are pinned to full commit SHAs (AGENTS.md).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # The source label links the package to this public repository so it takes its visibility.
          labels: org.opencontainers.image.source=https://github.com/NishantJh/OpenManage
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
