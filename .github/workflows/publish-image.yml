name: Publish image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openmanage-publish-image
  cancel-in-progress: false
jobs:
  publish:
    # workflow_dispatch can target arbitrary refs; only main is ever published.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The source label links the package to this public repository so it takes its visibility.
          labels: org.opencontainers.image.source=https://github.com/NishantJh/OpenManage
          tags: |
            ghcr.io/nishantjh/openmanage:latest
            ghcr.io/nishantjh/openmanage:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
