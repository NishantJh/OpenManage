services:
  app:
    build: .
    # Set OPENMANAGE_IMAGE=ghcr.io/nishantjh/openmanage:latest in .env to update with
    # `docker compose pull && docker compose up -d` instead of building on the host.
    image: ${OPENMANAGE_IMAGE:-openmanage:local}
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_URL: "postgres://openmanage@db:5432/openmanage?sslmode=disable"
      # Keep the password separate from the URI so reserved URL characters remain valid.
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      OPENMANAGE_ADMIN_USERNAME: "${OPENMANAGE_ADMIN_USERNAME:-admin}"
      OPENMANAGE_ADMIN_PASSWORD: "${OPENMANAGE_ADMIN_PASSWORD:-}"
      OPENMANAGE_COOKIE_SECURE: "${OPENMANAGE_COOKIE_SECURE:-false}"
      OPENMANAGE_ENCRYPTION_KEY: "${OPENMANAGE_ENCRYPTION_KEY:-}"
      # Built-in RADIUS is off unless this is set (for example ":1812"). Publishing it
      # also needs a ports entry such as "192.168.1.10:1812:1812/udp" for the LAN
      # address; never forward UDP 1812 from the internet.
      OPENMANAGE_RADIUS_LISTEN: "${OPENMANAGE_RADIUS_LISTEN:-}"
      OPENMANAGE_DNS_SERVER: "${OPENMANAGE_DNS_SERVER:-}"
    ports:
      - "${OPENMANAGE_PORT:-127.0.0.1:8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 1.0
    # Loopback-only by default. For LAN access, bind OPENMANAGE_PORT to a specific LAN IP
    # and restrict access with the host/router firewall. Use HTTPS for credentials/sessions.

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openmanage
      POSTGRES_USER: openmanage
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - openmanage_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmanage -d openmanage"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    cpus: 1.0
    security_opt: [no-new-privileges:true]

volumes:
  openmanage_db:
