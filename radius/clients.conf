# LAB ONLY: this client is restricted to loopback and uses a public test secret.
# Before allowing any OpenWrt AP to connect:
# 1. Change the secret to a long random value.
# 2. Add a separate client block with that AP's exact management IP.
# 3. Bind the service to the host's specific LAN IP, not 0.0.0.0.
# 4. Restrict UDP 1812/1813 to trusted AP addresses in the host firewall.
client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
    require_message_authenticator = no
}
client localhost_ipv6 {
    ipv6addr = ::1
    secret = testing123
    require_message_authenticator = no
}
